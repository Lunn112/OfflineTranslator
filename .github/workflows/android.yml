name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: chmod +x gradlew
      - name: Build and test (wrapper preferred, system Gradle fallback)
        shell: bash
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
          else
            gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
          fi
      - name: Build release (optional)
        shell: bash
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: OfflineTranslator-Debug, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: OfflineTranslator-Release, path: app/build/outputs/apk/release/app-release.apk, if-no-files-found: ignore, retention-days: 30 }
